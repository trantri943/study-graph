<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lewis · Study Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-screen canvas graph (Obsidian-style), floating search + panel. Single dark theme by choice. */
:root{
  --bg:#000; --panel:rgba(22,22,30,.92); --line:#2a2a36; --fg:#e7e6ee; --muted:#9b99aa;
  --accent:#8b7cf6; --mastered:#4ADE80; --learning:#FACC15; --weak:#F87171;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.top{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
input,button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input{flex:1;min-width:120px;max-width:320px}
@media (max-width:520px){.stat#stat{display:none}}
button{cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);outline:none}
input:focus-visible{outline:none;border-color:var(--accent)}
.legend{position:fixed;left:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;max-width:calc(100% - 32px);font-size:12px;color:var(--muted)}
.legend #legToggle{flex:none;font-size:11px;line-height:1;padding:5px 7px;border-radius:6px;color:var(--muted)}
.lg-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.legend.collapsed .lg-body{display:none}
.lg-row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.lg-row span{display:inline-flex;align-items:center;gap:6px}
#legGroups span{cursor:pointer}
#legGroups span.off{opacity:.35}
.legend i{display:inline-block;flex:none;border-radius:50%}
.lg-line{display:inline-block;width:18px;border-top:1.5px solid #8B8FA3}
.lg-line.dash{border-top:1.5px dashed #C4B5FD}
.lg-ring{width:8px;height:8px;border-radius:50%;border:2px solid;box-sizing:border-box;display:inline-block}
@media (max-width:520px){.legend{font-size:11px}.lg-row{gap:3px 10px}}
.panel{position:fixed;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:min(320px,calc(100% - 32px));box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;backdrop-filter:blur(8px);max-height:calc(100% - 140px);overflow:auto}
.panel h2{margin:0 0 2px;font-size:17px;font-weight:600;text-wrap:balance}
.panel .grp{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--fg);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}
.panel h3{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;font-weight:400}
.panel p{margin:0;font-size:14px;line-height:1.5}
.panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.panel li{font-size:13px;line-height:1.45}
.panel li a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.panel li a:hover{text-decoration-color:var(--accent)}
.rel{font-family:var(--mono);font-size:11px;color:var(--accent)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button{font-size:13px;padding:6px 10px}
.st.on[data-s="mastered"]{border-color:var(--mastered)}
.st.on[data-s="learning"]{border-color:var(--learning)}
.st.on[data-s="weak"]{border-color:var(--weak)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.stat{font-family:var(--mono);font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:13px}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
@media (max-width:520px){.panel{top:auto;left:16px;width:auto;bottom:calc(var(--legH,40px) + 20px + env(safe-area-inset-bottom,0px));max-height:48%}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px}
.chip.on{border-color:var(--accent);background:rgba(139,124,246,.18)}
.card{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:600;line-height:1.4}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;line-height:1.45}
.card dt{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:2px}
.card dd{margin:0}
.reader{position:fixed;inset:0;z-index:10;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
.reader .bar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(#000 70%,transparent)}
.md{max-width:680px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom,0px));font-size:16px;line-height:1.65;color:var(--fg);overflow-wrap:anywhere}
.md h1{font-size:22px;line-height:1.3;margin:0 0 16px}
.md h2{font-size:18px;margin:32px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);color:#b9b0ff}
.md h3{font-size:16px;margin:22px 0 4px}
.md p{margin:0 0 10px}
.md strong{color:#fff;font-weight:600}
.md ul{padding-left:20px}
.md pre{white-space:pre-wrap;font-family:var(--sans)}
.md details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.md details[open]{border-color:var(--accent)}
.md summary{cursor:pointer;font-weight:500}
.md details[open] summary{margin-bottom:6px;color:#b9b0ff}
.md table{display:block;overflow-x:auto;overflow-wrap:normal;border-collapse:collapse;font-size:14px;margin:0 0 12px}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{color:var(--muted);font-weight:500}
.md code{font-family:var(--mono);font-size:13px}
textarea{width:100%;box-sizing:border-box;height:140px;font-family:var(--mono);font-size:11px;color:var(--fg);background:#000;border:1px solid var(--line);border-radius:8px;padding:8px}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="top">
  <input id="q" placeholder="Tìm môn / khái niệm / từ vựng…" autocomplete="off">
  <button id="fitBtn">Căn giữa</button>
  <button id="allBtn" hidden>Xem toàn bộ</button>
  <button id="exportBtn">Xuất dữ liệu</button>
  <span class="stat" id="stat"></span>
</div>
<div class="legend" id="legend">
  <button id="legToggle" aria-label="Thu gọn chú thích" aria-expanded="true">▾</button>
  <div class="lg-body">
    <div class="lg-row" id="legGroups"></div>
    <div class="lg-row">
      <span><i style="width:11px;height:11px;background:#E7E6EE"></i>Nhóm</span>
      <span><i style="width:8px;height:8px;background:#E7E6EE"></i>Môn</span>
      <span><i style="width:4px;height:4px;background:#C9CCD6"></i>Mục</span>
      <span><b class="lg-line"></b>cha–con</span>
      <span><b class="lg-line dash"></b>liên kết</span>
      <span><b class="lg-ring" style="border-color:#4ADE80"></b><b class="lg-ring" style="border-color:#FACC15"></b><b class="lg-ring" style="border-color:#F87171"></b>trạng thái</span>
    </div>
  </div>
</div>
<div class="panel" id="info" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="reader" id="reader" hidden><div class="bar"><button id="closeReader">Đóng</button></div><div class="md" id="readerBody"></div></div>
<script src="vendor/marked-12.0.2.min.js"></script>

<script>
// ---------- Data (loaded from data.json) ----------
let GROUPS={}, NOTES={};
const color=g=>(GROUPS[g]&&GROUPS[g].color)||"#bbb";
const STATUS_KEY="study-graph-status-v1";
const STATUS_COLOR={mastered:"#4ADE80",learning:"#FACC15",weak:"#F87171"};
// Visual hierarchy by depth (0 = group root): radius / label size in screen px at zoom <= 1
const BASE_R=[18,12,7], BASE_R_DEEP=4, LABEL=[[15,700],[12,600],[11,400]], LABEL_DEEP=[10,400];
const TREE_EDGE="139,143,163", CROSS_EDGE="196,181,253";
function mixWhite(hex,t){const v=parseInt(hex.slice(1),16),c=[v>>16,(v>>8)&255,v&255].map(x=>Math.round(x+(255-x)*t));return `rgb(${c})`}
function fillOf(n){const c=color(n.group);return n.depth===0?c:n.depth===1?mixWhite(c,.2):n.depth===2?mixWhite(c,.55):"#C9CCD6"}
let status={};          // merged: data.json status + localStorage (newer lastReviewed wins)
let localStatus={};     // what this browser changed
let N=[],L=[],byId=new Map(),adj=new Map(),edgesOf=new Map();
const hidden=new Set();
let localRoot=null, localSet=null;  // local graph: node + neighbours within 2 steps

function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function init(data){
  GROUPS=data.groups||{}; NOTES=data.notes||{};
  try{localStatus=JSON.parse(localStorage.getItem(STATUS_KEY)||"{}")||{}}catch(e){localStatus={}}
  status=Object.assign({},data.status||{});
  for(const [k,v] of Object.entries(localStatus)){
    const cur=status[k]; if(!cur||(v.lastReviewed||"")>=(cur.lastReviewed||"")) status[k]=v; }

  N=(data.nodes||[]).map(n=>({id:n.id,group:n.group,parent:n.parent||null,level:n.level||"",x:0,y:0,vx:0,vy:0}));
  byId=new Map(N.map(n=>[n.id,n]));
  for(const n of N){ // depth from parent chain (0 = group root)
    let d=0,p=n.parent,guard=0; while(p&&byId.has(p)&&guard++<50){d++;p=byId.get(p).parent} n.depth=d; }
  // deterministic start (same layout every load): roots on a circle, children near their parent
  const roots=N.filter(n=>n.depth===0);
  roots.forEach((n,i)=>{const a=2*Math.PI*i/roots.length+0.6;n.x=Math.cos(a)*160;n.y=Math.sin(a)*160;});
  for(const n of [...N].sort((a,b)=>a.depth-b.depth)) if(n.depth>0){
    const p=byId.get(n.parent)||{x:0,y:0}, h=hash(n.id), a=(h%360)*Math.PI/180;
    n.x=p.x+Math.cos(a)*40; n.y=p.y+Math.sin(a)*40; }
  adj=new Map(N.map(n=>[n.id,new Set()])); edgesOf=new Map(N.map(n=>[n.id,[]])); L=[];
  const addEdge=(a,b,relation,note,tree)=>{
    if(!byId.has(a)||!byId.has(b)||a===b||adj.get(a).has(b)) return;
    const l={s:byId.get(a),t:byId.get(b),relation:relation||"",note:note||"",tree};
    L.push(l); adj.get(a).add(b); adj.get(b).add(a); edgesOf.get(a).push(l); edgesOf.get(b).push(l); };
  for(const n of N) if(n.parent) addEdge(n.parent,n.id,"","",true);
  for(const l of data.links||[]) addEdge(l.source,l.target,l.relation,l.note,false);
  for(const n of N) n.kids=N.filter(m=>m.parent===n.id).length;
  for(const n of N){ n.deg=adj.get(n.id).size; n.r=BASE_R[n.depth]||BASE_R_DEEP; n.nb=(NOTES[n.id]||{}).type==="notebook"; }
  document.getElementById("stat").textContent=N.length+" nodes · "+L.length+" links";
  drawLegend();
  alpha=1; for(let i=0;i<500;i++) tick(); alpha=0.05;
  view=fitView();
}

// ---------- Force simulation (no library) ----------
let alpha=1;
const isVis=n=>!hidden.has(n.group)&&(!localSet||localSet.has(n.id));
function tick(){
  if(alpha<0.005) return;
  const vis=N.filter(isVis);
  for(let i=0;i<vis.length;i++){const a=vis[i];
    for(let j=i+1;j<vis.length;j++){const b=vis[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+0.01;
      if(d2>250000) continue;
      const f=-1200*alpha/d2; dx*=f;dy*=f; a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy;}}
  for(const l of L){ if(!isVis(l.s)||!isVis(l.t)) continue;
    const dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const dm=Math.min(l.s.depth,l.t.depth), rest=l.tree?(dm===0?60+18*Math.sqrt(l.s.kids||1):dm===1?60:40):70;  // roots with many branches spread wider
    const k=(d-rest)/d*0.06*alpha; l.s.vx+=dx*k;l.s.vy+=dy*k;l.t.vx-=dx*k;l.t.vy-=dy*k;}
  for(const n of vis){ const g=(n.depth===0?0.018:0.008)*alpha; n.vx-=n.x*g; n.vy-=n.y*g;  // roots pulled harder so lone groups stay close
    if(n===drag){n.vx=n.vy=0;continue}
    n.x+=n.vx; n.y+=n.vy; n.vx*=0.6; n.vy*=0.6; }
  alpha*=0.985;
}

// ---------- Camera (smooth fly) ----------
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H,dpr,view={x:0,y:0,k:1},anim=null;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener("resize",resize);resize();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(target,ms=600){anim={from:{...view},to:target,t0:performance.now(),ms}}
function stepAnim(now){ if(!anim) return;
  const t=Math.min(1,(now-anim.t0)/anim.ms),e=ease(t),a=anim.from,b=anim.to;
  view={x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,k:a.k+(b.k-a.k)*e}; if(t>=1) anim=null; }
const label=n=>LABEL[n.depth]||LABEL_DEEP;
const rOf=n=>n.r*Math.max(.55,Math.min(1,view.k))/view.k;  // screen-px size: never grows past base on zoom-in, shrinks to 55% on zoom-out
function fitView(){
  const vis=N.filter(isVis); if(!vis.length) return {...view};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of vis){x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)}
  // free screen area: below top bar, above legend, beside/above the open panel
  const narrow=W<=520, open=!info.hidden;
  const top=76, bottom=H-legEl.offsetHeight-28-(open&&narrow?info.offsetHeight+12:0);
  const left=16, right=W-16-(open&&!narrow?info.offsetWidth+16:0);
  const cx=(x0+x1)/2, cy=(y0+y1)/2, hw=(right-left)/2, hh=Math.max(bottom-top,60)/2;
  // largest zoom where every node plus its (always-drawn) label stays inside the area
  let k=2.5;
  for(const n of vis){
    const [px,wt]=label(n), lab=n.depth<=1||localSet; ctx.font=`${wt} ${px}px IBM Plex Sans, system-ui, sans-serif`;
    const half=Math.max(n.r,lab?ctx.measureText(n.id).width/2:0), below=n.r+(lab?px+8:0);
    const dx=Math.abs(n.x-cx), dyU=cy-n.y, dyD=n.y-cy;
    if(dx>0) k=Math.min(k,(hw-half)/dx);
    if(dyU>0) k=Math.min(k,(hh-n.r)/dyU);
    if(dyD>0) k=Math.min(k,(hh-below)/dyD);
  }
  k=Math.max(0.15,k);
  return {k,x:(left+right)/2-W/2-cx*k,y:(top+bottom)/2-H/2-cy*k};
}
function flyToNode(n){const k=Math.max(view.k,1.2);
  // keep the node clear of the panel: right-side panel on desktop, bottom sheet on phones
  const narrow=W<=520, dx=narrow?0:-Math.min(170,W*0.15), dy=narrow?-H*0.22:0;
  flyTo({k,x:-n.x*k+dx,y:-n.y*k+dy})}

// ---------- Rendering ----------
let hover=null,selected=null,query="";
function focusSet(){ const f=hover||selected; if(!f) return null;  // hover/selection dims unrelated nodes
  const s=new Set(adj.get(f.id)); s.add(f.id); return s; }
function nodePath(n,r){ctx.beginPath();
  if(n.nb){const q=r*0.9,c=r*0.35;ctx.moveTo(n.x-q+c,n.y-q);ctx.arcTo(n.x+q,n.y-q,n.x+q,n.y+q,c);ctx.arcTo(n.x+q,n.y+q,n.x-q,n.y+q,c);
    ctx.arcTo(n.x-q,n.y+q,n.x-q,n.y-q,c);ctx.arcTo(n.x-q,n.y-q,n.x+q,n.y-q,c);ctx.closePath();}  // notebook: rounded square
  else ctx.arc(n.x,n.y,r,0,7);}
function draw(now){
  stepAnim(now);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*view.k,0,0,dpr*view.k,dpr*(W/2+view.x),dpr*(H/2+view.y));
  const k=view.k, f=hover||selected, fs=focusSet(), q=query.toLowerCase();
  for(const l of L){ if(!isVis(l.s)||!isVis(l.t)) continue;
    const on=f&&(l.s===f||l.t===f), dim=fs&&!on;
    const a=l.tree?(Math.min(l.s.depth,l.t.depth)<=1?.5:.25):.75;
    ctx.strokeStyle=`rgba(${l.tree?TREE_EDGE:CROSS_EDGE},${on?Math.min(1,a+.4):dim?a*.25:a})`;
    ctx.lineWidth=(on?1.5:1)/k; ctx.setLineDash(l.tree?[]:[4/k,4/k]);
    ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();}
  ctx.setLineDash([]);
  const labels=[];
  for(const n of N){ if(!isVis(n)) continue;
    const match=q&&nodeMatches(n,q);
    const dim=(fs&&!fs.has(n.id))||(q&&!match);
    const r=rOf(n)+(match?2/k:0);
    ctx.globalAlpha=dim?0.25:1;
    if(!dim&&n.depth<2){ctx.shadowColor=color(n.group);ctx.shadowBlur=(n.depth===0?22:8)*Math.min(k,1);}
    ctx.fillStyle=fillOf(n); nodePath(n,r); ctx.fill(); ctx.shadowBlur=0;
    const st=status[n.id]&&STATUS_COLOR[status[n.id].status];
    if(st){ctx.strokeStyle=st;ctx.lineWidth=2/k;nodePath(n,r+3/k);ctx.stroke();}  // review status ring; fill unchanged
    const [px,wt]=label(n);
    const near=(fs&&fs.has(n.id))||(selected&&adj.get(selected.id).has(n.id))||n===selected;
    const showLabel=n.depth<=1||localSet||near||match||(n.depth===2&&k>=1.2)||k>=2;
    if(showLabel) labels.push({n,px,wt,y:n.y+r+(px+4)/k,a:dim?0.25:1,
      prio:n.depth===0?0:(n===selected||n===hover)?1:match?2:near?3:4+n.depth});
    ctx.globalAlpha=1;}
  // labels: highest priority first; skip any that would overlap one already drawn (it appears on zoom-in)
  labels.sort((a,b)=>a.prio-b.prio);
  const placed=[]; ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(const L of labels){ const n=L.n;
    ctx.font=`${L.wt} ${L.px}px IBM Plex Sans, system-ui, sans-serif`;
    const w=ctx.measureText(n.id).width, sx=n.x*k+W/2+view.x, sy=L.y*k+H/2+view.y;
    const box=[sx-w/2-2,sy-L.px,sx+w/2+2,sy+L.px*0.3];
    if(L.prio>0&&placed.some(b=>box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1])) continue;
    placed.push(box);
    ctx.globalAlpha=L.a; ctx.fillStyle=n.depth===0?"#FFFFFF":n.depth===1?"#ECEDF2":n.depth===2?"#D9DBE3":"#C9CCD6";
    ctx.font=`${L.wt} ${L.px/k}px IBM Plex Sans, system-ui, sans-serif`; ctx.fillText(n.id,n.x,L.y); }
  ctx.globalAlpha=1;
  if(f) for(const l of edgesOf.get(f.id)||[]){ // relation labels at edge midpoints
    if(!l.relation||!isVis(l.s)||!isVis(l.t)) continue;
    const mx=(l.s.x+l.t.x)/2,my=(l.s.y+l.t.y)/2,px=11/k;
    ctx.font=`500 ${px}px IBM Plex Mono, ui-monospace, monospace`;
    const w=ctx.measureText(l.relation).width+8/k;
    ctx.fillStyle="rgba(0,0,0,.85)";ctx.fillRect(mx-w/2,my-px*0.85,w,px*1.7);
    ctx.fillStyle="#C4B5FD";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(l.relation,mx,my);ctx.textBaseline="alphabetic";}
}

// ---------- Interaction: pan, zoom, drag, tap ----------
const toWorld=(px,py)=>({x:(px-W/2-view.x)/view.k,y:(py-H/2-view.y)/view.k});
function pick(px,py){const p=toWorld(px,py);let best=null,bd=1e9;
  for(const n of N){if(!isVis(n))continue;const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<Math.max(rOf(n)+4/view.k,14/view.k)&&d<bd){bd=d;best=n}}return best}
let drag=null,panning=null,pointers=new Map(),pinch=null,moved=false;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;anim=null;
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};drag=null;panning=null;return}
  const n=pick(e.clientX,e.clientY); if(n){drag=n;alpha=Math.max(alpha,0.3)} else panning={x:e.clientX-view.x,y:e.clientY-view.y};});
cv.addEventListener("pointermove",e=>{
  if(pointers.has(e.pointerId)){const p=pointers.get(e.pointerId); if(Math.hypot(p.x-e.clientX,p.y-e.clientY)>4) moved=true; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});}
  if(pinch&&pointers.size===2){const [a,b]=[...pointers.values()];view.k=Math.min(6,Math.max(0.15,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));return}
  if(drag){const p=toWorld(e.clientX,e.clientY);drag.x=p.x;drag.y=p.y;alpha=Math.max(alpha,0.2);return}
  if(panning){view.x=e.clientX-panning.x;view.y=e.clientY-panning.y;return}
  if(e.pointerType==="mouse"){hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?"pointer":"grab"}});
function up(e){pointers.delete(e.pointerId); if(pointers.size<2)pinch=null;
  if(!moved&&pointers.size===0){const n=pick(e.clientX,e.clientY); if(n) open(n); else select(null)}
  drag=null;panning=null;}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")hover=null});
cv.addEventListener("wheel",e=>{e.preventDefault();anim=null;const f=Math.exp(-e.deltaY*0.0015);const nk=Math.min(6,Math.max(0.15,view.k*f));
  const mx=e.clientX-W/2,my=e.clientY-H/2;view.x=mx-(mx-view.x)*nk/view.k;view.y=my-(my-view.y)*nk/view.k;view.k=nk;},{passive:false});

// ---------- Local graph ----------
function setLocal(n){
  localRoot=n;
  if(n){ localSet=new Set([n.id]); let frontier=[n.id];
    for(let step=0;step<2;step++){const next=[];for(const id of frontier)for(const m of adj.get(id))if(!localSet.has(m)){localSet.add(m);next.push(m)}frontier=next;}
  } else localSet=null;
  document.getElementById("allBtn").hidden=!n; alpha=Math.max(alpha,0.3);
}
function open(n,word){ setLocal(n); select(n,word); for(let i=0;i<80;i++) tick(); flyTo(fitView()); }  // frame the local graph

// ---------- Panel ----------
const info=document.getElementById("info");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function select(n,word){selected=n; if(!n){info.hidden=true;return}
  const note=NOTES[n.id]||{}, has=["definition","example","question","answer"].some(k=>note[k]);
  const nb=note.type==="notebook", doc=note.type==="doc";
  const st=status[n.id]||{};
  const sec=(t,v)=>v?`<h3>${t}</h3><p>${esc(v)}</p>`:"";
  const notesHtml=nb?`<p class="hint" style="margin-top:0">${(note.words||[]).length} từ${note.source?" · "+esc(note.source):""}${note.created?" · "+esc(note.created):""}</p>
      <div class="chips">${(note.words||[]).map(w=>`<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
      <div id="card"></div>
      <div class="row"><button id="readBtn">📖 Xem toàn bộ</button></div>`
    :doc?`<div class="row" style="margin-top:0">${(note.files||[]).map((f,i)=>`<button class="docBtn" data-i="${i}">📖 ${esc(f.title)}</button>`).join("")}</div>`
    :has?sec("Định nghĩa",note.definition)+sec("Ví dụ",note.example)+sec("Câu hỏi",note.question)
      +(note.answer?`<div class="row"><button id="ansBtn">Hiện đáp án</button></div><p id="ans" hidden style="margin-top:8px">${esc(note.answer)}</p>`:"")
    :`<p class="hint">Chưa có ghi chú</p>`;
  const links=(edgesOf.get(n.id)||[]).map(l=>{const o=l.s===n?l.t:l.s;
    return `<li>→ ${l.relation?`<span class="rel">[${esc(l.relation)}]</span> `:""}<a data-id="${esc(o.id)}">${esc(o.id)}</a>${l.note?": "+esc(l.note):""}</li>`}).join("");
  const btn=(s,label)=>`<button class="st${st.status===s?" on":""}" data-s="${s}">${label}</button>`;
  info.innerHTML=`<h2>${esc(n.id)}</h2>
  <div class="grp"><span style="color:${color(n.group)}">${esc(n.group)}</span>${n.level?`<span class="badge">Level ${esc(n.level)}</span>`:""}</div>
  ${notesHtml}
  <h3>Trạng thái</h3>
  <div class="row" style="margin-top:4px">${btn("mastered","🟢 Đã nắm")}${btn("learning","🟡 Đang học")}${btn("weak","🔴 Yếu")}</div>
  ${st.lastReviewed?`<div class="hint">Ôn gần nhất: ${esc(st.lastReviewed)}</div>`:""}
  <h3>Liên kết</h3>${links?`<ul>${links}</ul>`:`<p class="hint">Chưa có liên kết</p>`}
  <div class="row"><button id="closeInfo">Đóng</button></div>`;
  info.hidden=false;
  const ab=document.getElementById("ansBtn"); if(ab) ab.onclick=()=>{const a=document.getElementById("ans");a.hidden=!a.hidden;ab.textContent=a.hidden?"Hiện đáp án":"Ẩn đáp án"};
  info.querySelectorAll("a[data-id]").forEach(a=>a.onclick=()=>open(byId.get(a.dataset.id)));
  info.querySelectorAll("button.st").forEach(b=>b.onclick=()=>setStatus(n,b.dataset.s));
  document.getElementById("closeInfo").onclick=()=>select(null);
  if(nb){ info.querySelectorAll(".chip").forEach(c=>c.onclick=()=>showCard(note,c.dataset.w));
    document.getElementById("readBtn").onclick=()=>openReader(note.file);
    if(word) showCard(note,word); }
  if(doc) info.querySelectorAll(".docBtn").forEach(b=>b.onclick=()=>openReader(note.files[+b.dataset.i].file));
}

// ---------- Vocabulary notebooks (content lives in vocab/*.md) ----------
const mdCache=new Map();
function loadMd(file){ if(!mdCache.has(file)) mdCache.set(file,fetch(file,{cache:"no-store"})
    .then(r=>{if(!r.ok) throw new Error("HTTP "+r.status);return r.text()}).catch(e=>{mdCache.delete(file);throw e}));
  return mdCache.get(file); }
const wordsOf=id=>{const t=NOTES[id];return t&&t.type==="notebook"&&t.words||[]};
const nodeMatches=(n,q)=>n.id.toLowerCase().includes(q)||wordsOf(n.id).some(w=>w.toLowerCase().includes(q));
// "### ① REWARD (n./v.) — ..." followed by "**Def:** ..." lines
function parseCards(md){
  const cards=new Map();
  for(const block of md.split(/^### /m).slice(1)){
    const lines=block.split("\n"), head=lines[0].trim();
    const m=head.match(/^[\u2460-\u2473\u3251-\u325f]\s*(.+?)\s*(\(|—|$)/); if(!m) continue;
    const fields=[]; for(const l of lines.slice(1)){const f=l.match(/^\*\*(\w+):\*\*\s*(.*)$/); if(f) fields.push([f[1],f[2]]);}
    cards.set(m[1].toLowerCase(),{head,fields});
  }
  return cards;
}
function showCard(note,word){
  const el=document.getElementById("card"); if(!el) return;
  info.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.w===word));
  el.className="card"; el.textContent="Đang tải…";
  loadMd(note.file).then(md=>{ if(!el.isConnected) return;
    const c=parseCards(md).get(word.toLowerCase());
    el.innerHTML=c?`<h4>${esc(c.head)}</h4><dl>${c.fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`
      :`<p class="hint" style="margin:0">Không tìm thấy mục của "${esc(word)}" trong ${esc(note.file)}.</p>`;
  }).catch(e=>{el.textContent="Không tải được "+note.file+" ("+e.message+")."});
}
const reader=document.getElementById("reader"),readerBody=document.getElementById("readerBody");
function openReader(file){
  readerBody.textContent="Đang tải…"; reader.hidden=false; reader.scrollTop=0;
  loadMd(file).then(md=>{ readerBody.innerHTML=window.marked?marked.parse(md,{breaks:true}):`<pre>${esc(md)}</pre>`; })
    .catch(e=>{readerBody.textContent="Không tải được "+file+" ("+e.message+")."});
}
document.getElementById("closeReader").onclick=()=>{reader.hidden=true};
addEventListener("keydown",e=>{if(e.key==="Escape"&&!reader.hidden) reader.hidden=true});
function findWord(q){ // exact word first, then prefix, then substring
  q=q.toLowerCase(); const all=[];
  for(const n of N) for(const w of wordsOf(n.id)) all.push([n,w]);
  return all.find(([,w])=>w.toLowerCase()===q)||all.find(([,w])=>w.toLowerCase().startsWith(q))||all.find(([,w])=>w.toLowerCase().includes(q));
}
function setStatus(n,s){
  const cur=status[n.id]&&status[n.id].status;
  const v={status:cur===s?"":s,lastReviewed:today()};  // tapping the active button clears it
  status[n.id]=v; localStatus[n.id]=v;
  try{localStorage.setItem(STATUS_KEY,JSON.stringify(localStatus))}catch(e){}
  select(n);
}

// ---------- Top bar ----------
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
document.getElementById("exportBtn").onclick=async()=>{
  const json=JSON.stringify(status,null,2);
  try{await navigator.clipboard.writeText(json);toast("Đã copy")}
  catch(e){selected=null;info.innerHTML=`<h2>Xuất dữ liệu</h2><p class="hint">Không copy tự động được. Hãy copy đoạn dưới đây:</p><textarea readonly>${esc(json)}</textarea><div class="row"><button id="closeInfo">Đóng</button></div>`;
    info.hidden=false;const ta=info.querySelector("textarea");ta.focus();ta.select();document.getElementById("closeInfo").onclick=()=>select(null);}
};
document.getElementById("fitBtn").onclick=()=>{select(null);flyTo(fitView())};
document.getElementById("allBtn").onclick=()=>{setLocal(null);select(null);for(let i=0;i<60;i++)tick();flyTo(fitView())};
const qEl=document.getElementById("q");
qEl.addEventListener("input",e=>{query=e.target.value.trim();
  if(!query) return; const q=query.toLowerCase();
  const m=N.find(n=>isVis(n)&&n.id.toLowerCase().startsWith(q))||(findWord(q)||[])[0]; if(m&&isVis(m)) flyToNode(m);});
qEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&query){
  const q=query.toLowerCase(), m=N.find(n=>n.id.toLowerCase().includes(q)), fw=!m&&findWord(q);
  const target=m||(fw&&fw[0]); if(target){hidden.delete(target.group);drawLegend();open(target,fw?fw[1]:undefined);qEl.blur()}}});

const LEG_KEY="study-graph-legend-collapsed";
const legEl=document.getElementById("legend"),legBtn=document.getElementById("legToggle");
function setLegend(c){legEl.classList.toggle("collapsed",c);legBtn.textContent=c?"▸ Chú thích":"▾";legBtn.setAttribute("aria-expanded",String(!c));
  try{localStorage.setItem(LEG_KEY,c?"1":"")}catch(e){}}
legBtn.onclick=()=>setLegend(!legEl.classList.contains("collapsed"));
new ResizeObserver(()=>document.documentElement.style.setProperty("--legH",legEl.offsetHeight+"px")).observe(legEl);
try{if(localStorage.getItem(LEG_KEY))setLegend(true)}catch(e){}
function drawLegend(){const el=document.getElementById("legGroups");
  el.innerHTML=Object.keys(GROUPS).map(g=>`<span data-g="${esc(g)}" class="${hidden.has(g)?"off":""}"><i style="width:9px;height:9px;background:${color(g)}"></i>${esc(g)}</span>`).join("");
  el.querySelectorAll("span").forEach(s=>s.onclick=()=>{const g=s.dataset.g;hidden.has(g)?hidden.delete(g):hidden.add(g);alpha=Math.max(alpha,.4);drawLegend()});}

fetch("data.json",{cache:"no-store"})
  .then(r=>{if(!r.ok) throw new Error("HTTP "+r.status);return r.json()})
  .then(d=>{init(d);(function loop(now){tick();draw(now||0);requestAnimationFrame(loop)})()})
  .catch(e=>{const d=document.createElement("div");d.className="err";
    d.textContent="Không tải được data.json ("+e.message+"). Trang cần chạy trên GitHub Pages hoặc một web server, không mở trực tiếp từ file.";document.body.appendChild(d)});
</script>
