<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lewis · Study Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-screen canvas graph (Obsidian-style), floating search + panel. Single dark theme by choice. */
:root{
  --bg:#000; --panel:rgba(22,22,30,.92); --line:#2a2a36; --fg:#e7e6ee; --muted:#8d8b9c;
  --accent:#8b7cf6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.top{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
input,button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input{flex:1;min-width:120px;max-width:320px}
@media (max-width:520px){.stat#stat{display:none}}
button{cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);outline:none}
input:focus-visible{outline:none;border-color:var(--accent)}
.legend{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 32px);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend span.off{opacity:.35}
.panel{position:fixed;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:min(300px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;backdrop-filter:blur(8px);max-height:60vh;overflow:auto}
.panel h2{margin:0 0 2px;font-size:17px;font-weight:600;text-wrap:balance}
.panel .grp{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.panel li{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.panel li:hover{border-color:var(--accent)}
.panel label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel input{width:100%;max-width:none;box-sizing:border-box}
.row{display:flex;gap:8px;margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.stat{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="top">
  <input id="q" placeholder="Tìm môn / khái niệm…" autocomplete="off">
  <button id="addBtn">+ Thêm</button>
  <button id="fitBtn">Căn giữa</button>
  <span class="stat" id="stat"></span>
</div>
<div class="legend" id="legend"></div>
<div class="panel" id="info" hidden></div>
<div class="panel" id="add" hidden>
  <h2>Thêm khái niệm</h2>
  <label for="nName">Tên</label><input id="nName" placeholder="VD: Fourier Transform">
  <label for="nLinks">Nối tới (cách nhau bằng dấu phẩy)</label><input id="nLinks" placeholder="VD: Calculus, Signals & Systems">
  <div class="row"><button id="saveAdd">Lưu</button><button id="cancelAdd">Đóng</button><button id="resetBtn">Reset mẫu</button></div>
  <div class="hint" id="addMsg">Thay đổi được lưu trong trình duyệt này.</div>
</div>

<script>
// ---------- Sample data: subjects → topics → concepts ----------

const CROSS = [
 ["Derivatives","Newton's Laws"],["Integrals","Energy"],["Differential Equations","RC Circuits"],["Laplace Transform","Signals & Systems"],
 ["Linear Algebra","Neural Networks"],["Matrices","Circuit Analysis"],["Eigenvalues","Quantum Mechanics"],["SVD","Machine Learning"],
 ["Probability","Machine Learning"],["Bayes' Rule","Classification"],["Boltzmann Distribution","Fermi Level"],["Boltzmann Distribution","Leakage Current"],
 ["Gradient Descent","Derivatives"],["Backpropagation","Derivatives"],["Boolean Algebra","Logic Gates"],["Graph Theory","Routing"],
 ["Graph Theory","Graph Search"],["Graph Search","Routing"],["Graphs","Graph Theory"],["Combinatorics","Placement"],
 ["Electric Field","PN Junction"],["Capacitance","MOSFET"],["Capacitance","RC Circuits"],["Maxwell's Equations","Signals & Systems"],
 ["Tunneling","Leakage Current"],["Band Theory","PN Junction"],["Energy Levels","Band Theory"],["Crystal Lattice","Silicon"],
 ["Wavefunction","Schrödinger Equation"],["Heat Transfer","Power Grid"],["Entropy","Thermodynamics"],
 ["Electron Configuration","Band Theory"],["Covalent Bonds","Silicon"],["Dopants","PN Junction"],["Dopants","Ion Implantation"],
 ["Oxidation","Deposition"],["Etching Chemistry","Lithography"],["Silicon","Wafer"],["Metallic Bonds","Routing"],
 ["Ohm's Law","Leakage Current"],["RC Circuits","STA"],["Timing","STA"],["Flip-Flops","Clock Tree Synthesis"],["FSM","RTL"],
 ["Logic Gates","Standard Cells"],["Op-Amps","Feedback"],["Sampling","Fourier Transform"],["Convolution","CNN"],
 ["MOSFET","CMOS Inverter"],["Threshold Voltage","MOSFET"],["FinFET","GAA"],["FinFET","Lithography"],["PPA","Floorplanning"],
 ["Synthesis","Placement"],["Standard Cells","Placement"],["Tcl","Physical Design"],["Python","EDA Automation"],["Shell Scripting","EDA Automation"],
 ["C / C++","Algorithms"],["Dynamic Programming","Routing"],["Big-O","Algorithms"],["Trees","Clock Tree Synthesis"],["Hash Tables","Cache"],
 ["CPU Pipeline","Timing"],["Memory Hierarchy","HBM Memory"],["ISA","RTL"],["Cache","GPU"],
 ["GPU","Neural Networks"],["AI Accelerators","VLSI Design"],["TPU / NPU","Transformers"],["ML-based Placement","Placement"],
 ["ML-based Placement","Machine Learning"],["LLM Agents","Transformers"],["EDA Automation","Physical Design"],["Transformers","Neural Networks"],
 ["Technical Vocabulary","Physical Design"],["Technical Vocabulary","Semiconductors"],["Research Papers","AI / ML"],["Research Papers","Device Physics"],
 ["Presentations","Academic Writing"],["Interview Skills","Physical Design"],["Interview Skills","Algorithms"],["Word Roots","Technical Vocabulary"],
 ["Solid State Physics","Device Physics"],["Quantum Mechanics","Device Physics"],["Digital Logic","VLSI Design"],["Computer Architecture","AI Hardware"],
 ["Materials Chemistry","Fabrication"],["Electromagnetism","Analog Circuits"],["Calculus","Physics"],["Linear Algebra","AI / ML"]
];

const LEAVES = {
 "Derivatives":["Chain Rule","Product Rule","Partial Derivative","Gradient","Jacobian"],
 "Integrals":["Riemann Sum","Integration by Parts","Area Under Curve","Double Integral"],
 "Series":["Taylor Series","Power Series","Convergence","Fourier Series"],
 "Matrices":["Matrix Multiplication","Determinant","Inverse Matrix","Transpose","Identity Matrix"],
 "Eigenvalues":["Eigenvectors","Diagonalization","Characteristic Polynomial","PCA"],
 "Distributions":["Normal Distribution","Poisson","Binomial","Uniform","Gaussian Noise"],
 "ODEs":["First-Order ODE","Second-Order ODE","Initial Conditions","Damping"],
 "Graph Theory":["Shortest Path","Spanning Tree","Steiner Tree","Graph Coloring","Min-Cut"],
 "Newton's Laws":["Force","Mass","Acceleration","Inertia"],
 "Energy":["Kinetic Energy","Potential Energy","Work","Power"],
 "Electric Field":["Coulomb's Law","Gauss's Law","Electric Potential","Drift"],
 "Magnetic Field":["Lorentz Force","Inductance","Faraday's Law","Ampère's Law"],
 "Band Theory":["Conduction Band","Valence Band","Band Gap","Effective Mass","Holes"],
 "Crystal Lattice":["Unit Cell","Miller Indices","Defects","Diamond Lattice"],
 "Fermi Level":["Fermi-Dirac","Intrinsic Carrier","Quasi-Fermi Level","Work Function"],
 "Tunneling":["Barrier Height","Gate Tunneling","Band-to-Band Tunneling"],

 "Filters":["Low-pass","High-pass","Band-pass","Cutoff Frequency"],

 "Wafer":["300mm Wafer","Die","Yield","Scribe Line"],
 "Floorplanning":["Die Size","Macro Placement","Aspect Ratio","Utilization","IO Placement","Blockages"],
 "Placement":["Global Placement","Legalization","Detailed Placement","Congestion","Wirelength","Density"],

 "Routing":["Global Routing","Detailed Routing","Metal Layers","Vias","Track Assignment","Crosstalk"],

 "DRC / LVS":["Spacing Rules","Width Rules","Antenna Effect","Netlist Compare","Density Rules"],
 "Power Grid":["IR Drop","Electromigration","Power Rings","Power Stripes","Decap Cells"],
 "CMOS Inverter":["NMOS","PMOS","Switching Threshold","Dynamic Power","Static Power"],
 "Standard Cells":["NAND","NOR","Buffer","Cell Library","Liberty File","Tie Cells"],
 "Synthesis":["Netlist","Logic Optimization","Technology Mapping","Gate Count"],
 "PPA":["Power","Performance","Area"],
 "Python":["NumPy","Pandas","Matplotlib","Scripts"],
 "Tcl":["Tcl Procs","Innovus Commands","ICC2 Commands","Tcl Lists"],
 "Graph Search":["BFS","DFS","Dijkstra","A* Search","Maze Routing"],
 "Dynamic Programming":["Memoization","Knapsack","Edit Distance"],
 "Cache":["L1 Cache","L2 Cache","Cache Miss","SRAM"],
 "CPU Pipeline":["Fetch","Decode","Execute","Hazards","Branch Prediction"],
 "Neural Networks":["Neuron","Activation Function","Weights","Layers","Loss Function"],
 "Transformers":["Attention","Self-Attention","Embeddings","Tokens","LLM"],
 "Gradient Descent":["Learning Rate","SGD","Adam","Loss Landscape"],
 "GPU":["CUDA","Parallelism","Tensor Cores","VRAM"],
 "AI Accelerators":["Systolic Array","MAC Units","Dataflow","On-chip SRAM"],
 "Technical Vocabulary":["Throughput","Latency","Yield","Tape-out","Sign-off","Node (nm)"],
 "Presentations":["Slide Structure","Storytelling","Q&A"],
 "Interview Skills":["STAR Method","Tell Me About Yourself","Behavioral Questions","Technical Questions"],
 "Pronunciation":["Stress","Intonation","Linking Sounds"],
 "Research Papers":["Abstract","Methodology","Results","Literature Review"]
};
function buildSample(){
  const nodes=[],links=[],seen=new Set();
  const add=(id,group,level)=>{ if(!seen.has(id)){seen.add(id);nodes.push({id,group,level});} };
  for(const [subj,topics] of Object.entries(TREE)){
    add(subj,subj,0);
    for(const [topic,cons] of Object.entries(topics)){
      add(topic,subj,1); links.push([subj,topic]);
      for(const c of cons){ add(c,subj,2); links.push([topic,c]); }
    }
  }
  for(const [p,ls] of Object.entries(LEAVES)){ const g=nodes.find(n=>n.id===p); if(!g) continue;
    for(const l of ls){ add(l,g.group,3); links.push([p,l]); } }
  for(const [a,b] of CROSS) if(seen.has(a)&&seen.has(b)) links.push([a,b]);
  return {nodes,links,custom:[]};
}

// ---------- State (with per-browser save of user additions) ----------
const KEY="study-graph-custom-v1";
let custom=[]; try{custom=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){custom=[]}
let N=[],L=[],byId=new Map(),adj=new Map();
const hidden=new Set();

function rebuild(keepPos){
  const old=new Map(N.map(n=>[n.id,n]));
  const d=buildSample();
  for(const c of custom){
    if(!d.nodes.find(n=>n.id===c.id)) d.nodes.push({id:c.id,group:"Mine",level:2});
    for(const t of c.links) d.links.push([c.id,t]);
  }
  N=d.nodes.map(n=>{const o=keepPos&&old.get(n.id);return Object.assign(n,o?{x:o.x,y:o.y,vx:0,vy:0}:{x:(Math.random()-.5)*800,y:(Math.random()-.5)*800,vx:0,vy:0})});
  byId=new Map(N.map(n=>[n.id,n]));
  L=[];adj=new Map(N.map(n=>[n.id,new Set()]));
  for(const [a,b] of d.links){ if(!byId.has(b)) continue; if(adj.get(a).has(b)) continue;
    L.push({s:byId.get(a),t:byId.get(b)}); adj.get(a).add(b); adj.get(b).add(a); }
  for(const n of N){ n.deg=adj.get(n.id).size; n.r=n.level===3?1.4:1.2+Math.sqrt(n.deg)*1.5; }
  document.getElementById("stat").textContent=N.length+" nodes · "+L.length+" links";
  alpha=1; drawLegend();
}
GROUPS["Mine"]="#ffb86c";
const color=g=>GROUPS[g]||"#bbb";

// ---------- Force simulation (no library) ----------
let alpha=1;
function tick(){
  if(alpha<0.005) return;
  const vis=N.filter(n=>!hidden.has(n.group));
  // repulsion
  for(let i=0;i<vis.length;i++){const a=vis[i];
    for(let j=i+1;j<vis.length;j++){const b=vis[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+0.01;
      if(d2>250000) continue;
      const f=-110*alpha/d2; dx*=f;dy*=f; a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy;}}
  // springs
  for(const l of L){ if(hidden.has(l.s.group)||hidden.has(l.t.group)) continue;
    const dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const lv=Math.min(l.s.level,l.t.level),leaf=l.s.level===3||l.t.level===3;
    const rest=leaf?14:lv===0?70:36;
    const k=(d-rest)/d*0.06*alpha; l.s.vx+=dx*k;l.s.vy+=dy*k;l.t.vx-=dx*k;l.t.vy-=dy*k;}
  for(const n of vis){ n.vx-=n.x*0.008*alpha; n.vy-=n.y*0.008*alpha;
    if(n===drag){n.vx=n.vy=0;continue}
    n.x+=n.vx; n.y+=n.vy; n.vx*=0.6; n.vy*=0.6; }
  alpha*=0.985;
}

// ---------- Rendering ----------
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H,dpr,view={x:0,y:0,k:0.7};
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener("resize",resize);resize();
let hover=null,selected=null,query="";
function focusSet(){
  const f=selected||hover; if(!f) return null;
  const s=new Set(adj.get(f.id)); s.add(f.id); return s;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*view.k,0,0,dpr*view.k,dpr*(W/2+view.x),dpr*(H/2+view.y));
  const fs=focusSet(), q=query.toLowerCase();
  ctx.lineWidth=0.6/view.k*1.2;
  for(const l of L){ if(hidden.has(l.s.group)||hidden.has(l.t.group)) continue;
    const on=fs&&fs.has(l.s.id)&&fs.has(l.t.id)&&(l.s===(selected||hover)||l.t===(selected||hover));
    ctx.strokeStyle=on?"rgba(139,124,246,.9)":fs?"rgba(120,120,135,.08)":"rgba(150,150,160,.32)";
    ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();}
  for(const n of N){ if(hidden.has(n.group)) continue;
    const match=q&&n.id.toLowerCase().includes(q);
    const dim=(fs&&!fs.has(n.id))||(q&&!match);
    ctx.globalAlpha=dim?0.15:1;
    if(!dim&&(n.level<2||n.deg>=5)){ctx.shadowColor=color(n.group);ctx.shadowBlur=n.level===0?16:8;}
    ctx.fillStyle=(n.level<=1||n.deg>=5||match)?color(n.group):"#d8d8e0";
    ctx.beginPath();ctx.arc(n.x,n.y,Math.max(match?n.r+2:n.r,(n.level===3?1.1:1.8)/view.k),0,7);ctx.fill();ctx.shadowBlur=0;
    const showLabel=(fs&&fs.has(n.id))||match||(n.level===0)||(view.k>1.1&&n.level===1)||view.k>1.9;
    if(showLabel&&!dim){ctx.fillStyle=n.level===0?"#fff":"#c9c8d6";
      ctx.font=`${n.level===0?600:400} ${(n.level===0?13:10.5)/Math.max(view.k,0.6)}px IBM Plex Sans, system-ui, sans-serif`;
      ctx.textAlign="center";ctx.fillText(n.id,n.x,n.y+n.r+12/Math.max(view.k,0.6));}
    ctx.globalAlpha=1;}
}

// ---------- Interaction: pan, zoom, drag, tap ----------
const toWorld=(px,py)=>({x:(px-W/2-view.x)/view.k,y:(py-H/2-view.y)/view.k});
function pick(px,py){const p=toWorld(px,py);let best=null,bd=1e9;
  for(const n of N){if(hidden.has(n.group))continue;const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<Math.max(n.r+4,12/view.k)&&d<bd){bd=d;best=n}}return best}
let drag=null,panning=null,pointers=new Map(),pinch=null,moved=false;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};drag=null;panning=null;return}
  const n=pick(e.clientX,e.clientY); if(n){drag=n;alpha=Math.max(alpha,0.3)} else panning={x:e.clientX-view.x,y:e.clientY-view.y};});
cv.addEventListener("pointermove",e=>{
  if(pointers.has(e.pointerId)){const p=pointers.get(e.pointerId); if(Math.hypot(p.x-e.clientX,p.y-e.clientY)>4) moved=true; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});}
  if(pinch&&pointers.size===2){const [a,b]=[...pointers.values()];view.k=Math.min(6,Math.max(0.15,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));return}
  if(drag){const p=toWorld(e.clientX,e.clientY);drag.x=p.x;drag.y=p.y;alpha=Math.max(alpha,0.2);return}
  if(panning){view.x=e.clientX-panning.x;view.y=e.clientY-panning.y;return}
  if(e.pointerType==="mouse"){hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?"pointer":"grab"}});
function up(e){pointers.delete(e.pointerId); if(pointers.size<2)pinch=null;
  if(!moved&&pointers.size===0){const n=pick(e.clientX,e.clientY);select(n)}
  drag=null;panning=null;}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015);const nk=Math.min(6,Math.max(0.15,view.k*f));
  const mx=e.clientX-W/2,my=e.clientY-H/2;view.x=mx-(mx-view.x)*nk/view.k;view.y=my-(my-view.y)*nk/view.k;view.k=nk;},{passive:false});

// ---------- Panels ----------
const info=document.getElementById("info"),addP=document.getElementById("add");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function select(n){selected=n; if(!n){info.hidden=true;return}
  addP.hidden=true;
  const nb=[...adj.get(n.id)].sort();
  const lvl=["Môn học","Chủ đề","Khái niệm","Chi tiết"][n.level];
  info.innerHTML=`<h2>${esc(n.id)}</h2><div class="grp" style="color:${color(n.group)}">${esc(n.group)} · ${lvl}</div>
  <div class="stat" style="margin-bottom:8px">${nb.length} liên kết</div><ul>${nb.map(x=>`<li data-id="${esc(x)}">${esc(x)}</li>`).join("")}</ul>
  <div class="row"><button id="closeInfo">Đóng</button><button id="linkHere">+ Nối từ đây</button></div>`;
  info.hidden=false;
  info.querySelectorAll("li").forEach(li=>li.onclick=()=>{const m=byId.get(li.dataset.id);select(m);centerOn(m)});
  document.getElementById("closeInfo").onclick=()=>select(null);
  document.getElementById("linkHere").onclick=()=>{openAdd();document.getElementById("nLinks").value=n.id};
}
function fit(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of N){if(hidden.has(n.group))continue;x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)}
  const k=Math.min((W-40)/(x1-x0||1),(H-160)/(y1-y0||1),2);view={k,x:-(x0+x1)/2*k,y:-(y0+y1)/2*k};}
function centerOn(n){view.x=-n.x*view.k;view.y=-n.y*view.k}
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();
  const m=query&&N.find(n=>n.id.toLowerCase().startsWith(query.toLowerCase())); if(m) centerOn(m);});
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const m=N.find(n=>n.id.toLowerCase().includes(query.toLowerCase()));if(m){select(m);centerOn(m)}}});
document.getElementById("fitBtn").onclick=()=>{fit();select(null)};
function openAdd(){info.hidden=true;addP.hidden=false;document.getElementById("addMsg").textContent="Thay đổi được lưu trong trình duyệt này.";document.getElementById("nName").focus()}
document.getElementById("addBtn").onclick=openAdd;
document.getElementById("cancelAdd").onclick=()=>addP.hidden=true;
document.getElementById("saveAdd").onclick=()=>{
  const name=document.getElementById("nName").value.trim(); const msg=document.getElementById("addMsg");
  if(!name){msg.textContent="Nhập tên khái niệm trước khi lưu.";return}
  const lookup=new Map(N.map(n=>[n.id.toLowerCase(),n.id]));
  const raw=document.getElementById("nLinks").value.split(",").map(s=>s.trim()).filter(Boolean);
  const ok=raw.map(s=>lookup.get(s.toLowerCase())).filter(Boolean), bad=raw.filter(s=>!lookup.has(s.toLowerCase()));
  const existing=custom.find(c=>c.id.toLowerCase()===name.toLowerCase());
  const id=lookup.get(name.toLowerCase())||name;
  if(existing) existing.links=[...new Set(existing.links.concat(ok))]; else custom.push({id,links:ok});
  try{localStorage.setItem(KEY,JSON.stringify(custom))}catch(e){}
  rebuild(true); const n=byId.get(id); if(n&&n.x===undefined){} select(n); if(n) centerOn(n);
  document.getElementById("nName").value="";document.getElementById("nLinks").value="";
  if(bad.length){addP.hidden=false;info.hidden=true;msg.textContent="Đã lưu. Không tìm thấy: "+bad.join(", ")+" (kiểm tra chính tả).";}
};
document.getElementById("resetBtn").onclick=()=>{custom=[];try{localStorage.removeItem(KEY)}catch(e){};rebuild(false);addP.hidden=true;};

function drawLegend(){const el=document.getElementById("legend");
  const groups=[...new Set(N.map(n=>n.group))];
  el.innerHTML=groups.map(g=>`<span data-g="${esc(g)}" class="${hidden.has(g)?"off":""}"><i style="background:${color(g)}"></i>${esc(g)}</span>`).join("");
  el.querySelectorAll("span").forEach(s=>s.onclick=()=>{const g=s.dataset.g;hidden.has(g)?hidden.delete(g):hidden.add(g);alpha=Math.max(alpha,.4);drawLegend()});}

rebuild(false);
for(let i=0;i<400;i++) tick(); alpha=0.2;
fit();
(function loop(){tick();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
